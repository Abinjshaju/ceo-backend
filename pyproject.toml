[project]
name = "ceo-backend"
version = "0.1.0"
description = "Backend and agents for the CEO decision workspace"
readme = "README.md"
authors = [
    { name = "ben", email = "ebinben@proton.me" }
]
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.0",
    "boto3>=1.43.111",
    "fastapi>=0.143.0",
    "langchain-core>=1.6.9",
    "langchain-google-genai>=4.4.1",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.6",
    "pyjwt[crypto]>=2.15.1",
    "pypdf>=6.20.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ceo-backend = "ceo_backend:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
