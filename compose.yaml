# The whole app: Postgres, a one-off migration, the web app (API + frontend), and the
# background worker. Secrets come from .env (or Dokploy's environment tab); see .env.example.
#
# Dokploy: deploy as a Docker Compose app and route a domain to service `app`, port 8000.
# No host ports are published; Dokploy's proxy reaches `app` over the internal network.
#
# Local (optional): docker compose up --build -d --wait, then publish a port with a
# compose.override.yaml, or run `docker compose up -d --wait db` for the database only.

x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://ceo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/ceo
    STORAGE_DIR: /data/storage
    PUBLIC_BASE_URL: ""
    JOBS_INLINE: "false"
  volumes:
    - storage:/data/storage
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ceo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ceo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceo -d ceo"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["ceo-backend", "migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["ceo-backend", "worker"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  storage:
